go2_gicp:
  ros__parameters:
    voxel_size: 0.15
    # Store/display denser XYZ without increasing GICP source resolution.
    map_voxel_size: 0.06
    keyframe_max_interval: 2.0
    # Shared mapping backend, inherited by standard AND dense. Separate from
    # the live/localization GICP thresholds below; never force closure by pose.
    loop_closure_enabled: true
    loop_keyframe_distance: 1.0
    loop_min_loop_travel: 20.0
    loop_min_loop_separation: 10
    loop_confirmation_distance: 1.0
    grid_resolution: 0.10
    # map origin is the first body pose. Measure ground height before Nav2.
    floor_z: -0.30
    obstacle_min_height: 0.10
    obstacle_max_height: 1.5
    # Compatibility name: advisory only, never reject a keyframe or crop history.
    max_map_points: 10000000
    submap_radius: 25.0
    registration_period: 0.5
    validity_timeout: 1.0
    # Bounded dead reckoning from the last accepted scan. Never renewed by
    # bad/empty scans; require cloud <=1s and real odometry <=0.3s throughout.
    # Patrol continuity: stop at the first elapsed-time/travel/turn limit.
    # This extends accepted-correction hold, not native sensor freshness.
    localization_hold_timeout: 5.0
    localization_hold_distance: 1.5
    localization_hold_rotation_degrees: 90.0
    localization_odom_timeout: 0.3
    # Independent recovery after previously accepted localization is lost.
    # Does not weaken normal GICP or extend the dead-reckoning limits above.
    auto_relocalization: true
    recovery_period: 1.0
    recovery_max_translation: 2.0
    recovery_max_rotation_degrees: 20.0
    recovery_confirmations: 3
    correspondence_distance: 0.7
    min_fitness: 0.55
    max_rmse: 0.20
    max_translation: 0.6
    max_rotation: 0.35
    # Match accumulated patrol scans with fewer registration points. Retain
    # the complete saved map and real odometry; mapping quality is unchanged.
    localization_voxel_size: 0.10
    localization_correspondence: 0.70
    # Bound scan-to-odometry residuals during patrol turns separately from
    # mapping. Actual cumulative turning still comes from timestamped odom.
    localization_max_translation: 1.0
    localization_max_rotation_degrees: 45.0
    localization_min_fitness: 0.20
    localization_max_rmse: 0.20
    correction_alpha: 0.25
    # Patrol localization tolerates measured scan variation. Mapping
    # keeps its separate 5cm / 2deg jump check; source freshness is still 1s.
    stationary_translation_limit: 0.35
    stationary_rotation_limit_degrees: 12.0
